# docker/ 서브폴더에 compose 파일을 두면 Compose가 프로젝트 이름을 폴더명("docker")으로
# 추론해 같은 구조를 쓰는 다른 프로젝트와 이름이 충돌할 수 있다(docker_guide.md §9).
# 실제로 다른 프로젝트에서 이 문제로 별개 프로젝트의 운영 중이던 컨테이너가 삭제된 사고가
# 있었으므로 명시적으로 지정한다.
name: dart-fss-extractor

services:
  # 수동 벌크 수집(main.py) 및 일회성 명령 실행용.
  # 사용 예: docker compose run --rm dart-fss-extractor python src/main.py --start-year 2026 --end-year 2026
  dart-fss-extractor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dart-fss-extractor:latest
    entrypoint: ["/app/docker/app-entrypoint.sh"]
    user: root
    volumes:
      - ../data:/app/data
      - ../output:/app/output
      # OAuth refresh token(token.json)이 실행 중 갱신되므로 쓰기 가능해야 한다.
      - ../secrets:/app/secrets
      - ../.env:/app/.env:ro
    environment:
      TZ: Asia/Seoul

  # daily_scheduler.py를 컨테이너 내장 cron으로 주기 실행 (스케줄은 docker/crontab 참고).
  dart-fss-extractor-cron:
    container_name: dart-fss-extractor-cron
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dart-fss-extractor:latest
    entrypoint: ["/app/docker/cron-entrypoint.sh"]
    user: root
    restart: unless-stopped
    volumes:
      - ../data:/app/data
      - ../output:/app/output
      - ../secrets:/app/secrets
      - ../.env:/app/.env:ro
    environment:
      TZ: Asia/Seoul
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
